name: Build & Push Docker Images

on:
  push:
    branches: [dev]
    tags: ["v*"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build:
    name: Build / ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [api, web, chat-service, search-indexer]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            # On dev branch → dev + dev-{sha}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,prefix=dev-,enable=${{ github.ref == 'refs/heads/dev' }}
            # On version tag → v1.2.3 (what make infra-tag, make rollback and the
            # deploy jobs pull), 1.2.3, 1.2 and latest
            type=semver,pattern=v{{version}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ─── Staging deploy (on dev push) ──────────────────────────────────────
  # Dokploy redeploys the compose app from its own webhook once every image
  # is built. It answers 301 "Branch Not Match" unless the payload reads as a
  # GitHub push to the branch the app tracks, hence the push-shaped body.
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/dev'
    environment: staging
    steps:
      - name: Trigger Dokploy redeploy
        env:
          DOKPLOY_DEPLOY_URL: ${{ secrets.DOKPLOY_DEPLOY_URL }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ -z "$DOKPLOY_DEPLOY_URL" ]; then
            echo "::error::DOKPLOY_DEPLOY_URL secret is not set"
            exit 1
          fi
          payload=$(jq -n \
            --arg ref "$GITHUB_REF" \
            --arg sha "$GITHUB_SHA" \
            --arg msg "$COMMIT_MESSAGE" \
            '{ref: $ref, after: $sha, head_commit: {id: $sha, message: $msg}}')
          status=$(curl -sS -o response.txt -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Event: push' \
            --data "$payload" "$DOKPLOY_DEPLOY_URL")
          cat response.txt; echo
          if [ "$status" != "200" ]; then
            echo "::error::Dokploy answered HTTP $status"
            exit 1
          fi

  # ─── Production deploy (on version tag) ────────────────────────────────────
  # Preview, then a reviewer's approval, then `pulumi up` on the AKS stack
  # (deploy-production.yml). A rollback runs that workflow by hand. Skipped
  # until `make prod-ci-setup` has set PULUMI_BACKEND_URL: the very first
  # deploy, with its data restore, is done by hand (runbook).
  deploy-production:
    name: Production
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.PULUMI_BACKEND_URL != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-production.yml
    secrets: inherit
