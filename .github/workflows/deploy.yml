name: Deploy (Manual)

# Force-deploy an image tag to the staging compose server over SSH, e.g. a
# rollback: make rollback v=1.1.0 env=staging. Production is the Pulumi stack:
# deploy-production.yml (make rollback v=1.1.0).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        required: true
        options: [staging]
      tag:
        description: "Image tag to deploy (e.g. v1.2.3 or dev)"
        type: string
        required: true

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    name: Deploy ${{ inputs.tag }} → ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve server secrets
        id: server
        run: |
          echo "host=${{ secrets.STAGING_HOST }}"   >> $GITHUB_OUTPUT
          echo "user=${{ secrets.STAGING_USER }}"   >> $GITHUB_OUTPUT
          echo "path=${{ secrets.STAGING_PATH }}"   >> $GITHUB_OUTPUT
          echo "key<<EOF"                            >> $GITHUB_OUTPUT
          echo "${{ secrets.STAGING_SSH_KEY }}"     >> $GITHUB_OUTPUT
          echo "EOF"                                 >> $GITHUB_OUTPUT

      - name: Upload compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.server.outputs.host }}
          username: ${{ steps.server.outputs.user }}
          key: ${{ steps.server.outputs.key }}
          source: deployments/docker-compose/docker-compose.yml
          target: ${{ steps.server.outputs.path }}
          strip_components: 2

      - name: Pull & deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.server.outputs.host }}
          username: ${{ steps.server.outputs.user }}
          key: ${{ steps.server.outputs.key }}
          script: |
            set -e
            cd ${{ steps.server.outputs.path }}
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export IMAGE_REGISTRY=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            export IMAGE_TAG=${{ inputs.tag }}
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            echo "✓ [${{ inputs.environment }}] registry: $IMAGE_REGISTRY tag: $IMAGE_TAG"
