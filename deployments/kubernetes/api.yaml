# Uploads live in object storage (S3 or Azure Blob, STORAGE_PROVIDER in
# configmap.yaml), never on a pod volume: the API runs 2 to 6 replicas on
# different nodes, and a ReadWriteOnce disk can follow only one of them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: bns
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: REGISTRY/api:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: bns-config
            - secretRef:
                name: bns-secrets
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: production
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # The API has no /api/health: /api/public/config is the route every
          # client calls first, served once Payload is up. A first boot
          # (indexes, the market, workflows) gets five minutes.
          startupProbe:
            httpGet:
              path: /api/public/config
              port: 3000
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/public/config
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/public/config
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: bns
spec:
  selector:
    app: api
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: bns
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
