apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  namespace: bns
  labels:
    app: chat-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chat-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: chat-service
    spec:
      containers:
        - name: chat-service
          image: REGISTRY/chat-service:latest
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: bns-config
            - secretRef:
                name: bns-secrets
          env:
            - name: PORT
              value: "4000"
            - name: NODE_ENV
              value: production
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: chat-service
  namespace: bns
spec:
  selector:
    app: chat-service
  ports:
    - port: 4000
      targetPort: 4000
