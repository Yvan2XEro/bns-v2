# SECRET TEMPLATE — do NOT commit real values.
# Fill values with: kubectl create secret generic bns-secrets -n bns \
#   --from-literal=MONGO_PASSWORD=... \
#   --from-literal=REDIS_PASSWORD=... \
#   ... (see keys below)
#
# Or use Sealed Secrets / External Secrets Operator in production.
apiVersion: v1
kind: Secret
metadata:
  name: bns-secrets
  namespace: bns
type: Opaque
stringData:
  # MongoDB
  MONGO_PASSWORD: "CHANGE_ME"

  # Redis
  REDIS_PASSWORD: "CHANGE_ME"

  # Meilisearch
  MEILI_MASTER_KEY: "CHANGE_ME"
  MEILISEARCH_API_KEY: "CHANGE_ME"  # same as MEILI_MASTER_KEY

  # Payload
  PAYLOAD_SECRET: "CHANGE_ME_MIN_32_CHARS"

  # OAuth
  GOOGLE_OAUTH_CLIENT_ID: ""
  GOOGLE_OAUTH_CLIENT_SECRET: ""
  APPLE_OAUTH_CLIENT_ID: ""
  APPLE_OAUTH_TEAM_ID: ""
  APPLE_OAUTH_KEY_ID: ""
  APPLE_OAUTH_PRIVATE_KEY: ""
  FACEBOOK_OAUTH_APP_ID: ""
  FACEBOOK_OAUTH_APP_SECRET: ""

  # Payments
  NOTCHPAY_PUBLIC_KEY: ""
  NOTCHPAY_HASH_KEY: ""
  STRIPE_PUBLISHABLE_KEY: ""
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""

  # Notifications
  NOVU_SECRET_KEY: ""
  NOVU_APPLICATION_IDENTIFIER: ""
  NOVU_EXPO_INTEGRATION_IDENTIFIER: ""

  # Chat service
  CHAT_SERVICE_EMAIL: "chat@buynsellem.com"
  CHAT_SERVICE_PASSWORD: "CHANGE_ME"
