# BNS — same stack as docker-compose.yml, with a managed MongoDB (Atlas).
#
# Use this where the host cannot run MongoDB 5+: a CPU without AVX kills mongod
# with "Illegal instruction (core dumped)" at startup, and no compose setting
# works around a missing instruction set.
#
# Why Atlas and not a local MongoDB 4: the app needs multi-document
# transactions, Payload only enables them when the connection is to a replica
# set, and every Atlas cluster — the free M0 included — is one already. A local
# standalone mongod would start fine and then silently run every P0 write
# without a transaction.
#
# Differences from docker-compose.yml, and only these:
#   - no `mongodb` service, and no `mongo_data` volume;
#   - no `mongo-express` (Atlas has its own data browser);
#   - `api` no longer waits on mongodb, and DATABASE_URI is required — there is
#     no local database left to default to.
# Everything else — build contexts, Traefik labels, domains, the rest of the
# environment — is identical, so the two files stay comparable.
#
# On the Atlas side, before the first `up`:
#   - allow this host's public IP under Network Access (a cluster rejects
#     everything by default, and the failure looks like a connection timeout);
#   - create a database user with readWrite on the target database;
#   - take the SRV connection string and append the database name.
#
# An SRV string carries the replica set implicitly, so transactions come on
# without `replicaSet=` ever appearing in the URI. Verify rather than assume,
# with the probe — it opens a transaction, writes to two collections, aborts,
# and fails if either write survived, which is the only proof that transactions
# are actually live rather than silently falling back to plain writes.
#
# Run it from a CHECKOUT, not from the container: the api image is the Next
# standalone output (see packages/api/Dockerfile — it copies .next/standalone,
# public and the static assets, never src/), so no script lives in there.
#   cd packages/api
#   DATABASE_URI='<the same Atlas string>' bun run src/scripts/transactionProbe.ts
#
#   docker compose -f docker-compose.atlas.yml up -d

services:
  # --- Infrastructure ---
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:latest
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?Set MEILI_MASTER_KEY}
      MEILI_ENV: ${MEILI_ENV:-production}
    volumes:
      - meili_data:/meili_data
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7700/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # --- Application ---
  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    restart: unless-stopped
    environment:
      # No local fallback on purpose: with no mongodb service to default to, a
      # missing DATABASE_URI must stop the deploy rather than start an API that
      # has nowhere to write. Transactions ride on the Atlas replica set, so the
      # first rollback level here is the cluster, not a URI option.
      DATABASE_URI: ${DATABASE_URI:?Set DATABASE_URI to the Atlas connection string}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Set PAYLOAD_SECRET}
      PAYLOAD_PUBLIC_SERVER_URL: ${PAYLOAD_PUBLIC_SERVER_URL:-https://${API_DOMAIN:-api.buynsellem.com}}
      PAYLOAD_ALLOWED_ORIGINS: ${PAYLOAD_ALLOWED_ORIGINS:-https://${WEB_DOMAIN:-buynsellem.com},https://${WEB_WWW_DOMAIN:-www.buynsellem.com}}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # Hops of X-Forwarded-For to trust for the client IP used by rate
      # limiting: 1 for Traefik, the single reverse proxy in front of this
      # container here.
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}
      # Dev-only escape hatch: logs the generated phone verification code
      # instead of requiring a configured SMS provider. Only takes effect when
      # NODE_ENV is not "production", so leaving this "true" in a .env copied
      # onto a production deploy has no effect. Empty/off by default.
      PHONE_OTP_DEV_LOG: ${PHONE_OTP_DEV_LOG:-}
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      NOVU_SECRET_KEY: ${NOVU_SECRET_KEY:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      APPLE_OAUTH_CLIENT_ID: ${APPLE_OAUTH_CLIENT_ID}
      APPLE_OAUTH_TEAM_ID: ${APPLE_OAUTH_TEAM_ID}
      APPLE_OAUTH_KEY_ID: ${APPLE_OAUTH_KEY_ID}
      APPLE_OAUTH_PRIVATE_KEY: ${APPLE_OAUTH_PRIVATE_KEY}
      # The iOS bundle identifier, for native Sign in with Apple. Distinct from
      # APPLE_OAUTH_CLIENT_ID above, which is the Services ID used by the web
      # flow — Apple binds the client secret to whichever one issued the token.
      APPLE_NATIVE_CLIENT_ID: ${APPLE_NATIVE_CLIENT_ID:-}
      FACEBOOK_OAUTH_APP_ID: ${FACEBOOK_OAUTH_APP_ID}
      FACEBOOK_OAUTH_APP_SECRET: ${FACEBOOK_OAUTH_APP_SECRET}
      NOTCHPAY_PUBLIC_KEY: ${NOTCHPAY_PUBLIC_KEY}
      NOTCHPAY_HASH_KEY: ${NOTCHPAY_HASH_KEY}
      NOTCHPAY_BASE_URL: ${NOTCHPAY_BASE_URL:-https://api.notchpay.co}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      NOVU_APPLICATION_IDENTIFIER: ${NOVU_APPLICATION_IDENTIFIER:-}
      NOVU_API_URL: ${NOVU_API_URL:-https://api.novu.co}
      NOVU_EXPO_INTEGRATION_IDENTIFIER: ${NOVU_EXPO_INTEGRATION_IDENTIFIER:-}
      CHAT_PUBLIC_URL: ${CHAT_PUBLIC_URL:-https://${CHAT_DOMAIN:-chat.buynsellem.com}}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-https://${WEB_DOMAIN:-buynsellem.com}}
      # Storage
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_STORAGE_ACCOUNT_BASEURL: ${AZURE_STORAGE_ACCOUNT_BASEURL:-}
      AZURE_STORAGE_CONTAINER_NAME: ${AZURE_STORAGE_CONTAINER_NAME:-}
      AZURE_STORAGE_ALLOW_CONTAINER_CREATE: ${AZURE_STORAGE_ALLOW_CONTAINER_CREATE:-false}
    volumes:
      - api_media:/app/packages/api/media
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      # HTTPS
      - "traefik.http.routers.bns-api.rule=Host(`${API_DOMAIN:-api.buynsellem.com}`)"
      - "traefik.http.routers.bns-api.entrypoints=websecure"
      - "traefik.http.routers.bns-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.bns-api.service=bns-api"

      # HTTP -> HTTPS redirect
      - "traefik.http.routers.bns-api-http.rule=Host(`${API_DOMAIN:-api.buynsellem.com}`)"
      - "traefik.http.routers.bns-api-http.entrypoints=web"
      - "traefik.http.routers.bns-api-http.middlewares=bns-redirect-https"
      - "traefik.http.middlewares.bns-redirect-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.bns-redirect-https.redirectscheme.permanent=true"
      - "traefik.http.services.bns-api.loadbalancer.server.port=3000"

  web:
    build:
      context: .
      dockerfile: ./packages/web/Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://${API_DOMAIN:-api.buynsellem.com}}
      NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL:-https://${WEB_DOMAIN:-buynsellem.com}}
      CHAT_PUBLIC_URL: ${CHAT_PUBLIC_URL:-https://${CHAT_DOMAIN:-chat.buynsellem.com}}
      NOVU_APPLICATION_IDENTIFIER: ${NOVU_APPLICATION_IDENTIFIER:-}
    depends_on:
      - api
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      # HTTPS apex — serves the app
      - "traefik.http.routers.bns-web.rule=Host(`${WEB_DOMAIN:-buynsellem.com}`)"
      - "traefik.http.routers.bns-web.entrypoints=websecure"
      - "traefik.http.routers.bns-web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.bns-web.service=bns-web"
      # HTTPS www — 301 redirect to apex
      - "traefik.http.routers.bns-web-www.rule=Host(`${WEB_WWW_DOMAIN:-www.buynsellem.com}`)"
      - "traefik.http.routers.bns-web-www.entrypoints=websecure"
      - "traefik.http.routers.bns-web-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.bns-web-www.middlewares=bns-www-to-apex"
      - "traefik.http.routers.bns-web-www.service=bns-web"
      # Middleware: www -> apex permanent redirect (preserves path and query)
      - "traefik.http.middlewares.bns-www-to-apex.redirectregex.regex=^https://[^/]+(.*)"
      - "traefik.http.middlewares.bns-www-to-apex.redirectregex.replacement=https://${WEB_DOMAIN:-buynsellem.com}$${1}"
      - "traefik.http.middlewares.bns-www-to-apex.redirectregex.permanent=true"
      # HTTP -> HTTPS redirect (both apex and www; www will then 301 to apex)
      - "traefik.http.routers.bns-web-http.rule=Host(`${WEB_DOMAIN:-buynsellem.com}`) || Host(`${WEB_WWW_DOMAIN:-www.buynsellem.com}`)"
      - "traefik.http.routers.bns-web-http.entrypoints=web"
      - "traefik.http.routers.bns-web-http.middlewares=bns-redirect-https"
      - "traefik.http.services.bns-web.loadbalancer.server.port=3001"

  chat-service:
    build:
      context: .
      dockerfile: packages/chat-service/Dockerfile
    restart: unless-stopped
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      PAYLOAD_API_URL: http://api:3000/api
      CORS_ORIGIN: ${CORS_ORIGIN:-https://${WEB_DOMAIN:-buynsellem.com},https://${WEB_WWW_DOMAIN:-www.buynsellem.com}}
      CHAT_SERVICE_EMAIL: ${CHAT_SERVICE_EMAIL}
      CHAT_SERVICE_PASSWORD: ${CHAT_SERVICE_PASSWORD}

      PORT: 4000
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      # HTTPS
      - "traefik.http.routers.bns-chat.rule=Host(`${CHAT_DOMAIN:-chat.buynsellem.com}`)"
      - "traefik.http.routers.bns-chat.entrypoints=websecure"
      - "traefik.http.routers.bns-chat.tls.certresolver=letsencrypt"
      - "traefik.http.routers.bns-chat.service=bns-chat"
      # HTTP -> HTTPS redirect
      - "traefik.http.routers.bns-chat-http.rule=Host(`${CHAT_DOMAIN:-chat.buynsellem.com}`)"
      - "traefik.http.routers.bns-chat-http.entrypoints=web"
      - "traefik.http.routers.bns-chat-http.middlewares=bns-redirect-https"
      - "traefik.http.services.bns-chat.loadbalancer.server.port=4000"

  search-indexer:
    build:
      context: .
      dockerfile: packages/search-indexer/Dockerfile
    restart: unless-stopped
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      PAYLOAD_API_URL: http://api:3000/api
    depends_on:
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - dokploy-network

volumes:
  redis_data:
  meili_data:
  api_media:

networks:
  dokploy-network:
    external: true
