# Production overrides — use pre-built images from GHCR instead of building locally
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  api:
    build: !reset null
    image: ghcr.io/${GITHUB_REPO}/api:main
    environment:
      # Threaded here too, empty, so this file alone never hides that these
      # three exist — production stays off because the values are empty and
      # the AppSettings gate refuses, never because the wiring is missing.
      PAYMENTS_PROVIDER: ${PAYMENTS_PROVIDER:-}
      COURIER_PROVIDER: ${COURIER_PROVIDER:-}
      YANGO_DELIVERY_BASE_URL: ${YANGO_DELIVERY_BASE_URL:-}
      YANGO_DELIVERY_API_KEY: ${YANGO_DELIVERY_API_KEY:-}
      YANGO_DELIVERY_WEBHOOK_SECRET: ${YANGO_DELIVERY_WEBHOOK_SECRET:-}
      NOTCHPAY_PRIVATE_KEY: ${NOTCHPAY_PRIVATE_KEY:-}
      PROTECTED_PAYMENT_ALLOWED: ${PROTECTED_PAYMENT_ALLOWED:-}

  web:
    build: !reset null
    image: ghcr.io/${GITHUB_REPO}/web:main

  chat-service:
    build: !reset null
    image: ghcr.io/${GITHUB_REPO}/chat-service:main

  search-indexer:
    build: !reset null
    image: ghcr.io/${GITHUB_REPO}/search-indexer:main
