# Template for the azure-prod stack. Copy it once, then let Pulumi write to the copy:
#   cp stacks/azure-prod.example.yaml Pulumi.azure-prod.yaml && pulumi stack init azure-prod
# Pulumi.azure-prod.yaml is git-ignored: it receives the encryption salt, the
# encrypted secrets and the app variables. Never put real values here.
#
config:
  # App variables: copied from the production .env, never typed by hand —
  #   bun run infra:env:check --env <.env> --stack <this stack>   (repo root)
  #   bun run infra:env:apply --env <.env> --stack <this stack>
  # It writes appEnv, appSecrets (encrypted), domain, acmeEmail and ghcrToken.
  bns-infra:cloudProvider: azure
  bns-infra:region: westeurope
  bns-infra:nodeCount: "3"
  bns-infra:vmSize: Standard_D2s_v3
  bns-infra:imageRegistry: ghcr.io/yvan2xero/bns-v2
  bns-infra:imageTag: latest
  bns-infra:domain: buynsellem.com
  bns-infra:acmeEmail: your@email.com
