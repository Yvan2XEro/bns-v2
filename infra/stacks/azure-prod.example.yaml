# Template for the azure-prod stack. Never put real values here. Create the stack with:
#   bun run stack:init --stack azure-prod [--ssh-key ~/.ssh/bns-k3s] [--env ../.env.azure-prod]
# which writes .stacks/Pulumi.azure-prod.yaml (git-ignored) from this file.
#
config:
  # App variables: copied from the production .env, never typed by hand —
  #   bun run infra:env:check --env <.env> --stack <this stack>   (repo root)
  #   bun run infra:env:apply --env <.env> --stack <this stack>
  # It writes appEnv, appSecrets (encrypted), domain, acmeEmail and ghcrToken.
  bns-infra:cloudProvider: azure
  bns-infra:region: westeurope
  bns-infra:nodeCount: "3"
  bns-infra:vmSize: Standard_D2s_v3
  bns-infra:imageRegistry: ghcr.io/yvan2xero/bns-v2
  # A release tag, never `latest` or `dev`: production runs a known build.
  bns-infra:imageTag: v1.1.0
  bns-infra:domain: buynsellem.com
  bns-infra:acmeEmail: your@email.com
  # The database: MongoDB Atlas on Azure (src/atlas.ts), continuous backup
  # and point-in-time restore. Atlas API keys stay in the shell:
  #   export MONGODB_ATLAS_PUBLIC_KEY=… MONGODB_ATLAS_PRIVATE_KEY=…
  bns-infra:database: atlas
  bns-infra:atlas:
    orgId: your-atlas-organization-id
    # instanceSize: M10        # smallest tier with point-in-time restore
    # restoreWindowDays: 7
    # regionName: EUROPE_WEST  # derived from bns-infra:region when omitted
    # accessCidrs: ["203.0.113.7"]  # your IP, only during the first restore
  # First deploy only: everything but the API, so the staging data can be
  # restored before anything writes (docs/runbook-aks-production.md).
  bns-infra:apiPaused: true
